[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forexlab"
version = "0.1.0"
description = "Forex AI research lab: research engine and cost-aware backtester (Phase 1)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[project.scripts]
forexlab = "forexlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
